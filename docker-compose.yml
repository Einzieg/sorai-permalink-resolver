services:
  sorai-permalink-resolver:
    build: .
    image: sorai-permalink-resolver:latest
    container_name: sorai-permalink-resolver
    restart: unless-stopped
    ports:
      - "13131:13131"
    environment:
      PORT: "13131"
      HOST: "0.0.0.0"
      SPR_STRICT_PORT: "1"
      SPR_AUTH_KEY: "${SPR_AUTH_KEY}"
      SORAI_PARSE_URL: "${SORAI_PARSE_URL}"
      SORAI_PARSE_TOKEN: "${SORAI_PARSE_TOKEN}"

